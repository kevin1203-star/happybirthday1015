
<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <title>生日快乐</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: "Avenir", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    canvas {
      position: absolute;
    }
    
    /* 点阵文字canvas样式 */
    .canvas {
      z-index: 2;
    }
    
    /* 烟花canvas样式 */
    .firework-canvas {
      z-index: 1;
    }
    
    /* 为点阵文字系统添加必要的样式 */
    .body--ready {
      background: -webkit-linear-gradient(top, rgb(238, 156, 167) 0%, rgb(238, 156, 167) 120%);
      background: -moz-linear-gradient(top, rgb(238, 156, 167) 0%, rgb(238, 156, 167) 120%);
      background: -o-linear-gradient(top, rgb(238, 156, 167) 0%, rgb(238, 156, 167) 120%);
      background: -ms-linear-gradient(top, rgb(238, 156, 167) 0%, rgb(238, 156, 167) 120%);
      background: linear-gradient(top, rgb(238, 156, 167) 0%, rgb(238, 156, 167) 120%);
    }
  </style>
</head>

<body>
  <!-- 点阵文字canvas -->
  <canvas class="canvas"></canvas>
  
  <!-- 烟花效果的canvas -->
  <canvas class="firework-canvas"></canvas>
  <canvas class="firework-canvas"></canvas>
  <canvas class="firework-canvas"></canvas>

  <script>
    // ============================
    // 第一部分：点阵文字动画系统（简化版）
    // ============================
    
    // 简化的点阵文字系统，移除所有UI元素和交互
    var S = {
      init: function () {
        var m = 0;
        
        // 初始化点阵文字系统
        S.Drawing.init('.canvas');
        document.body.classList.add('body--ready');

        // 初始化烟花系统
        initFireworks();

        // 显示文字序列
        S.UI.simulate('嗨|宝宝|生日快乐！|天天开心！|永远幸福！|前程似锦！');

        S.Drawing.loop(function () {
          m++;
          S.Shape.render();
          
          // 700帧后跳转
          if (m == 700) {
            window.location.href = "h.html";
          }
        });
      }
    };

    // 简化的Drawing模块
    S.Drawing = (function () {
      var canvas,
          context,
          renderFn
          requestFrame = window.requestAnimationFrame       ||
                         window.webkitRequestAnimationFrame ||
                         window.mozRequestAnimationFrame    ||
                         window.oRequestAnimationFrame      ||
                         window.msRequestAnimationFrame     ||
                         function(callback) {
                           window.setTimeout(callback, 1000 / 60);
                         };

      return {
        init: function (el) {
          canvas = document.querySelector(el);
          context = canvas.getContext('2d');
          this.adjustCanvas();

          window.addEventListener('resize', function (e) {
            S.Drawing.adjustCanvas();
          });
        },

        loop: function (fn) {
          renderFn = !renderFn ? fn : renderFn;
          this.clearFrame();
          renderFn();
          requestFrame.call(window, this.loop.bind(this));
        },

        adjustCanvas: function () {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        },

        clearFrame: function () {
          context.clearRect(0, 0, canvas.width, canvas.height);
        },

        getArea: function () {
          return { w: canvas.width, h: canvas.height };
        },

        drawCircle: function (p, c) {
          context.fillStyle = c.render();
          context.beginPath();
          context.arc(p.x, p.y, p.z, 0, 2 * Math.PI, true);
          context.closePath();
          context.fill();
        }
      }
    }());

    // 简化的UI模块 - 只保留文字显示功能
    S.UI = (function () {
      var sequence = [];
      var currentIndex = 0;
      var interval;
      
      function performAction(value) {
        sequence = value.split('|');
        currentIndex = 0;
        
        // 显示第一个文字
        if (sequence.length > 0) {
          S.Shape.switchShape(S.ShapeBuilder.letter(sequence[currentIndex]));
          
          // 设置定时器切换文字
          clearInterval(interval);
          interval = setInterval(function() {
            currentIndex = (currentIndex + 1) % sequence.length;
            S.Shape.switchShape(S.ShapeBuilder.letter(sequence[currentIndex]), true);
          }, 2000); // 每2秒切换一次文字
        }
      }

      return {
        simulate: function (action) {
          performAction(action);
        }
      }
    }());

    // 简化的点类
    S.Point = function (args) {
      this.x = args.x;
      this.y = args.y;
      this.z = args.z;
      this.a = args.a;
      this.h = args.h;
    };

    // 简化的颜色类
    S.Color = function (r, g, b, a) {
      this.r = r;
      this.g = g;
      this.b = b;
      this.a = a;
    };

    S.Color.prototype = {
      render: function () {
        return 'rgba(' + this.r + ',' + this.g + ',' + this.b + ',' + this.a + ')';
      }
    };

    // 简化的点类
    S.Dot = function (x, y) {
      this.p = new S.Point({
        x: x,
        y: y,
        z: 5,
        a: 1,
        h: 0
      });

      this.e = 0.07;
      this.s = true;

      this.c = new S.Color(255, 255, 255, this.p.a);
      this.t = this.clone();
      this.q = [];
    };

    S.Dot.prototype = {
      clone: function () {
        return new S.Point({
          x: this.p.x,
          y: this.p.y,
          z: this.p.z,
          a: this.p.a,
          h: this.p.h
        });
      },

      _draw: function () {
        this.c.a = this.p.a;
        S.Drawing.drawCircle(this.p, this.c);
      },

      _moveTowards: function (n) {
        var details = this.distanceTo(n, true),
            dx = details[0],
            dy = details[1],
            d = details[2],
            e = this.e * d;

        if (this.p.h === -1) {
          this.p.x = n.x;
          this.p.y = n.y;
          return true;
        }

        if (d > 1) {
          this.p.x -= ((dx / d) * e);
          this.p.y -= ((dy / d) * e);
        } else {
          if (this.p.h > 0) {
            this.p.h--;
          } else {
            return true;
          }
        }

        return false;
      },

      _update: function () {
        if (this._moveTowards(this.t)) {
          var p = this.q.shift();

          if (p) {
            this.t.x = p.x || this.p.x;
            this.t.y = p.y || this.p.y;
            this.t.z = p.z || this.p.z;
            this.t.a = p.a || this.p.a;
            this.p.h = p.h || 0;
          } else {
            if (this.s) {
              this.p.x -= Math.sin(Math.random() * 3.142);
              this.p.y -= Math.sin(Math.random() * 3.142);
            } else {
              this.move(new S.Point({
                x: this.p.x + (Math.random() * 50) - 25,
                y: this.p.y + (Math.random() * 50) - 25,
              }));
            }
          }
        }

        var d = this.p.a - this.t.a;
        this.p.a = Math.max(0.1, this.p.a - (d * 0.05));
        d = this.p.z - this.t.z;
        this.p.z = Math.max(1, this.p.z - (d * 0.05));
      },

      distanceTo: function (n, details) {
        var dx = this.p.x - n.x,
            dy = this.p.y - n.y,
            d = Math.sqrt(dx * dx + dy * dy);

        return details ? [dx, dy, d] : d;
      },

      move: function (p, avoidStatic) {
        if (!avoidStatic || (avoidStatic && this.distanceTo(p) > 1)) {
          this.q.push(p);
        }
      },

      render: function () {
        this._update();
        this._draw();
      }
    };

    // 简化的形状构建器
    S.ShapeBuilder = (function () {
      var gap = 13,
          shapeCanvas = document.createElement('canvas'),
          shapeContext = shapeCanvas.getContext('2d'),
          fontSize = 500,
          fontFamily = 'Arial, sans-serif';

      function fit() {
        shapeCanvas.width = Math.floor(window.innerWidth / gap) * gap;
        shapeCanvas.height = Math.floor(window.innerHeight / gap) * gap;
        shapeContext.fillStyle = 'red';
        shapeContext.textBaseline = 'middle';
        shapeContext.textAlign = 'center';
      }

      function processCanvas() {
        var pixels = shapeContext.getImageData(0, 0, shapeCanvas.width, shapeCanvas.height).data;
            dots = [],
            x = 0,
            y = 0,
            fx = shapeCanvas.width,
            fy = shapeCanvas.height,
            w = 0,
            h = 0;

        for (var p = 0; p < pixels.length; p += (4 * gap)) {
          if (pixels[p + 3] > 0) {
            dots.push(new S.Point({
              x: x,
              y: y
            }));

            w = x > w ? x : w;
            h = y > h ? y : h;
            fx = x < fx ? x : fx;
            fy = y < fy ? y : fy;
          }

          x += gap;

          if (x >= shapeCanvas.width) {
            x = 0;
            y += gap;
            p += gap * 4 * shapeCanvas.width;
          }
        }

        return { dots: dots, w: w + fx, h: h + fy };
      }

      function setFontSize(s) {
        shapeContext.font = 'bold ' + s + 'px ' + fontFamily;
      }

      function isNumber(n) {
        return !isNaN(parseFloat(n)) && isFinite(n);
      }

      function init() {
        fit();
        window.addEventListener('resize', fit);
      }

      // Init
      init();

      return {
        letter: function (l) {
          var s = 0;

          setFontSize(fontSize);
          s = Math.min(fontSize,
                      (shapeCanvas.width / shapeContext.measureText(l).width) * 0.8 * fontSize, 
                      (shapeCanvas.height / fontSize) * (isNumber(l) ? 1 : 0.45) * fontSize);
          setFontSize(s);

          shapeContext.clearRect(0, 0, shapeCanvas.width, shapeCanvas.height);
          shapeContext.fillText(l, shapeCanvas.width / 2, shapeCanvas.height / 2);

          return processCanvas();
        }
      };
    }());

    // 简化的形状类
    S.Shape = (function () {
      var dots = [],
          width = 0,
          height = 0,
          cx = 0,
          cy = 0;

      function compensate() {
        var a = S.Drawing.getArea();
        cx = a.w / 2 - width / 2;
        cy = a.h / 2 - height / 2;
      }

      return {
        switchShape: function (n, fast) {
          var size,
              a = S.Drawing.getArea();

          width = n.w;
          height = n.h;

          compensate();

          if (n.dots.length > dots.length) {
            size = n.dots.length - dots.length;
            for (var d = 1; d <= size; d++) {
              dots.push(new S.Dot(a.w / 2, a.h / 2));
            }
          }

          var d = 0,
              i = 0;

          while (n.dots.length > 0) {
            i = Math.floor(Math.random() * n.dots.length);
            dots[d].e = fast ? 0.25 : (dots[d].s ? 0.14 : 0.11);

            if (dots[d].s) {
              dots[d].move(new S.Point({
                z: Math.random() * 20 + 10,
                a: Math.random(),
                h: 18
              }));
            } else {
              dots[d].move(new S.Point({
                z: Math.random() * 5 + 5,
                h: fast ? 18 : 30
              }));
            }

            dots[d].s = true;
            dots[d].move(new S.Point({
              x: n.dots[i].x + cx,
              y: n.dots[i].y + cy,
              a: 1,
              z: 5,
              h: 0
            }));

            n.dots = n.dots.slice(0, i).concat(n.dots.slice(i + 1));
            d++;
          }

          for (var i = d; i < dots.length; i++) {
            if (dots[i].s) {
              dots[i].move(new S.Point({
                z: Math.random() * 20 + 10,
                a: Math.random(),
                h: 20
              }));

              dots[i].s = false;
              dots[i].e = 0.04;
              dots[i].move(new S.Point({ 
                x: Math.random() * a.w,
                y: Math.random() * a.h,
                a: 0.3,
                z: Math.random() * 4,
                h: 0
              }));
            }
          }
        },

        render: function () {
          for (var d = 0; d < dots.length; d++) {
            dots[d].render();
          }
        }
      }
    }());

    // ============================
    // 第二部分：烟花系统
    // ============================
    function initFireworks() {
      // 烟花系统的初始化
      const canvases = document.querySelectorAll('.firework-canvas');
      const c1 = canvases[0];
      const c2 = canvases[1];
      const c3 = canvases[2];
      
      const ctx1 = c1.getContext('2d');
      const ctx2 = c2.getContext('2d');
      const ctx3 = c3.getContext('2d');
      
      let fontSize = 200;
      const rockets = [];
      const shards = [];
      const fidelity = 3;
      let counter = 0;
      
      // 设置画布大小
      function resizeFireworkCanvas() {
        c2.width = c3.width = window.innerWidth;
        c2.height = c3.height = window.innerHeight;
      }
      
      resizeFireworkCanvas();
      window.addEventListener('resize', resizeFireworkCanvas);
      
      ctx1.fillStyle = '#000';
      
      // 设置canvas3的样式
      ctx3.fillStyle = '#FFF';
      ctx3.shadowColor = '#FFF';
      ctx3.shadowBlur = 25;
      
      // 烟花系统的Shard类
      class FireworkShard {
        constructor(x, y, hue) {
          this.x = x;
          this.y = y;
          this.hue = hue;
          this.lightness = 50;
          this.size = 4 + Math.random() * 3; // 减小粒子大小
          const angle = Math.random() * 2 * Math.PI;
          const blastSpeed = 0.5 + Math.random() * 3; // 减小爆炸速度
          this.xSpeed = Math.cos(angle) * blastSpeed;
          this.ySpeed = Math.sin(angle) * blastSpeed;
          this.target = null; // 烟花系统不需要目标点
          this.ttl = 80;
          this.timer = 0;
        }
        
        draw() {
          ctx2.fillStyle = `hsl(${this.hue}, 100%, ${this.lightness}%)`;
          ctx2.beginPath();
          ctx2.arc(this.x, this.y, this.size, 0, 2 * Math.PI);
          ctx2.closePath();
          ctx2.fill();
        }
        
        update() {
          // 烟花碎片只是简单的下落和消散
          this.ySpeed += 0.05;
          this.x += this.xSpeed;
          this.y += this.ySpeed;
          this.size = Math.max(0.5, this.size * 0.98);
          this.timer++;
          
          if (this.y > c2.height || this.timer >= this.ttl) {
            this.markForRemoval = true;
          }
        }
      }
      
      // 烟花系统的Rocket类
      class FireworkRocket {
        constructor() {
          const quarterW = c2.width / 4;
          this.x = quarterW + Math.random() * (c2.width - quarterW);
          this.y = c2.height - 15;
          this.angle = Math.random() * Math.PI / 4 - Math.PI / 6;
          this.blastSpeed = 4 + Math.random() * 5; // 减小速度
          this.xSpeed = Math.sin(this.angle) * this.blastSpeed;
          this.ySpeed = -Math.cos(this.angle) * this.blastSpeed;
          this.hue = Math.floor(Math.random() * 360);
          this.exploded = false;
        }
        
        draw() {
          ctx2.save();
          ctx2.translate(this.x, this.y);
          ctx2.rotate(Math.atan2(this.ySpeed, this.xSpeed) + Math.PI / 2);
          ctx2.fillStyle = `hsl(${this.hue}, 100%, 50%)`;
          ctx2.fillRect(0, 0, 3, 10); // 减小火箭大小
          ctx2.restore();
        }
        
        update() {
          this.x += this.xSpeed;
          this.y += this.ySpeed;
          this.ySpeed += 0.08; // 减小重力
          
          if (this.ySpeed > 0 && !this.exploded) {
            this.explode();
          }
        }
        
        explode() {
          this.exploded = true;
          
          // 创建烟花碎片
          for (let i = 0; i < 40; i++) { // 减少碎片数量
            shards.push(new FireworkShard(this.x, this.y, this.hue));
          }
        }
      }
      
      // 烟花动画循环
      function fireworkLoop() {
        // 绘制半透明背景
        ctx2.fillStyle = "rgba(0, 0, 0, 0.05)";
        ctx2.fillRect(0, 0, c2.width, c2.height);
        
        counter += 1;
        
        // 定期发射烟花
        if (counter % 40 === 0) { // 减少烟花发射频率
          rockets.push(new FireworkRocket());
        }
        
        // 更新和绘制火箭
        for (let i = rockets.length - 1; i >= 0; i--) {
          const rocket = rockets[i];
          rocket.draw();
          rocket.update();
          
          if (rocket.exploded) {
            rockets.splice(i, 1);
          }
        }
        
        // 更新和绘制碎片
        for (let i = shards.length - 1; i >= 0; i--) {
          const shard = shards[i];
          shard.draw();
          shard.update();
          
          if (shard.markForRemoval) {
            shards.splice(i, 1);
          }
        }
        
        requestAnimationFrame(fireworkLoop);
      }
      
      // 开始烟花动画
      fireworkLoop();
    }
    
    // 初始化整个系统
    window.addEventListener('load', function() {
      S.init();
    });
  </script>
</body>
</html>
