<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎂 致我的女孩，生日快乐</title>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Noto Sans SC", system-ui, sans-serif;
            color: #442c2e;
            background: radial-gradient(ellipse at top left, #fff3ec 0%, #ffe9df 50%, #ffdfd3 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 飘落花瓣 */
        .petal {
            position: fixed;
            top:-24px;
            width:14px;
            height:18px;
            border-radius: 50% 0 50% 50%;
            opacity:0.65;
            z-index:1;
            animation: petalFall linear infinite;
        }
        @keyframes petalFall {
            0% {transform: translateY(-10vh) rotate(0deg);}
            100% {transform: translateY(110vh) rotate(1080deg);}
        }

        /* 点击生成爱心 */
        .heart {
            position:fixed;
            pointer-events:none;
            z-index:4;
            font-size:26px;
            animation: heartFly 1.6s ease-out forwards;
        }
        @keyframes heartFly{
            0%{opacity:1;transform: translateY(0) scale(1);}
            100%{opacity:0;transform: translateY(-180px) scale(1.7);}
        }

        /* 主内容区域 */
        .container {
            position: relative;
            z-index:3;
            max-width:680px;
            margin:0 auto;
            padding:70px 22px 90px;
            text-align:center;
        }

        .main-title{
            font-family:"ZCOOL KuaiLe", cursive;
            font-size: clamp(42px,10vw,70px);
            background:linear-gradient(90deg,#ff5e7c,#ff9460,#ffbc70);
            -webkit-background-clip:text;
            background-clip:text;
            color:transparent;
            margin-bottom:12px;
            opacity:0;
            transform: translateY(-20px);
            animation: titlePop 1.2s ease-out forwards;
        }
        .sub-heading{
            font-size:17px;
            color:#b06b60;
            letter-spacing:6px;
            margin-bottom:48px;
            opacity:0;
            animation: fadeSoft 1.4s ease forwards 0.3s;
        }

        /* 礼物模块 */
        .gift-block{
            margin-bottom:48px;
            opacity:0;
            animation: fadeSoft 1.4s ease forwards 0.5s;
        }
        .gift-box{
            width:220px;
            max-width:65%;
            filter: drop-shadow(0 8px 18px rgba(255,120,135,0.25));
        }
        .wish-button{
            margin-top:22px;
            padding:14px 36px;
            border-radius:999px;
            border:none;
            background:linear-gradient(135deg,#ff6b78,#ff4e72);
            color:#fff;
            font-size:16px;
            font-weight:600;
            letter-spacing:2px;
            cursor:pointer;
            box-shadow:0 10px 28px rgba(255,110,120,0.30);
            transition: all 0.3s ease;
        }
        .wish-button:hover{
            transform: translateY(-5px);
            box-shadow:0 16px 36px rgba(255,110,120,0.38);
        }

        /* 磨砂贺卡卡片 */
        .note-card{
            background:rgba(255,255,255,0.70);
            border:1px solid rgba(255,255,255,0.85);
            border-radius:32px;
            padding:42px 36px;
            backdrop-filter: blur(16px);
            box-shadow: 0 22px 55px rgba(180,120,110,0.15), 0 2px 8px rgba(255,255,255,0.6) inset;
            text-align:left;
            opacity:0;
            transform: translateY(40px);
            animation: cardSlideUp 1.4s ease forwards 0.8s;
        }
        .note-card .note-top{
            font-size:22px;
            font-weight:600;
            color:#e25868;
            margin-bottom:22px;
        }
        .note-card p{
            font-size:16px;
            line-height:2.1;
            color:#583c3e;
            margin-bottom:18px;
        }
        .note-card .sign-off{
            margin-top:32px;
            text-align:right;
            color:#946466;
            font-style:italic;
        }

        /* 动画 */
        @keyframes titlePop{
            to{opacity:1;transform:translateY(0);}
        }
        @keyframes cardSlideUp{
            to{opacity:1;transform:translateY(0);}
        }
        @keyframes fadeSoft{
            to{opacity:1;}
        }

        /* 移动端适配 */
        @media(max-width:580px){
            .note-card{
                padding:30px 24px;
            }
            .note-card p{
                font-size:15px;
            }
            .sub-heading{
                letter-spacing:3px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="main-title">生日快乐，宝贝</h1>
        <p class="sub-heading">HAPPY BIRTHDAY · 岁岁有我，年年是你</p>

        <div class="gift-block">
            <svg class="gift-box" viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">
                <rect x="25" y="70" width="150" height="100" rx="8" fill="#ff7887"/>
                <rect x="85" y="70" width="30" height="100" fill="#ffd0d6"/>
                <rect x="15" y="45" width="170" height="30" rx="6" fill="#ff8c9a"/>
                <path d="M100 10 C130 35,160 35,100 60 C40 35,70 35,100 10" fill="#ffb4bc"/>
            </svg>
            <br>
            <button class="wish-button" onclick="location.href='wish.html'">💌 许下心愿</button>
        </div>

        <div class="note-card">
            <p class="note-top">致我最爱的女孩：</p>
            <p>生日快乐，我的宝贝。很幸运可以陪你度过这个生日，能参与你的人生，是我最珍贵的小幸福。</p>
            <p>愿新的一岁，你不用被世俗约束，可以安心做自己。希望你永远被爱包围，眼里永远保有星光，难过时有依靠，开心有人和你分享。</p>
            <p>我会一直在你身边，陪你看人间烟火，陪你经历平凡日常，也陪你奔赴所有浪漫与远方。不管未来怎样，我都会坚定站在你的身后。</p>
            <p>愿你平安健康，永远漂亮，永远热爱生活。所有的美好和温柔，都奔你而来。</p>
            <p class="sign-off">永远爱你的人<br></p>
        </div>
    </div>

    <script>
        // 飘落花瓣
        function createPetal(){
            const petal = document.createElement("div");
            petal.className="petal";
            petal.style.left = Math.random()*100+"vw";
            petal.style.background = ["#ffb8c1","#ffd2b3","#ffc4d8","#ffd7cd"][Math.floor(Math.random()*4)];
            petal.style.animationDuration = (4 + Math.random()*4)+"s";
            document.body.appendChild(petal);
            setTimeout(()=>petal.remove(),8000);
        }
        setInterval(createPetal,260);

        // 点击页面飘爱心
        document.addEventListener("click",(ev)=>{
            const heart = document.createElement("div");
            heart.className="heart";
            heart.innerText=["❤️","🧡","💛","💖","💝"][Math.floor(Math.random()*5)];
            heart.style.left = ev.clientX+"px";
            heart.style.top = ev.clientY+"px";
            document.body.appendChild(heart);
            setTimeout(()=>heart.remove(),1600);
        })
    </script>
</body>
</html>
